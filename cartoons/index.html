<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikeverse Cartoons — Movie Night at the $NIKEPIG Barn</title>
<meta name="description" content="Watch every Nikeverse cartoon at movie night in the $NIKEPIG barn on Bison Valley Ranch.">
<link rel="icon" href="../icons/pig.png">
<link href="https://fonts.cdnfonts.com/css/more-sugar" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1026;--wheat:#f5deb3;--glow:#ffd36e;--prop-w:14;--ar:1.7534}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:#fff;font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.6rem 1rem;background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none}
.topbar a,.topbar h1,.topbar button{pointer-events:auto}
.topbar h1{white-space:nowrap}
@media (max-width:480px){.topbar{gap:.5rem;padding:.25rem .75rem}.topbar .bk{display:none}.topbar a{font-size:1.3rem;min-width:32px;min-height:32px;display:flex;align-items:center}}
.topbar a{color:var(--wheat);text-decoration:none;font-weight:800}
.topbar h1{font-family:'More Sugar',cursive;line-height:1.1;font-size:clamp(1.1rem,2.6vw,1.9rem);color:var(--glow);text-shadow:0 2px 10px rgba(0,0,0,.6)}
/* The barn scene keeps the background's aspect (4096x2336): as wide as fits, bottom-aligned; any spare strip
   (above on tall-ish screens, at the sides on very wide ones) shows a blurred copy. --sw/--sch scene size, --top scene top. */
.theatre{position:relative;width:100vw;height:100vh;overflow:hidden;
  --sw:min(100vw,calc(100vh*var(--ar)));--sch:calc(var(--sw)/var(--ar));--top:calc(100vh - var(--sch))}
.theatre::before{content:'';position:absolute;inset:-40px;background:var(--bg-1x) center bottom/cover no-repeat;filter:blur(24px) brightness(.55)}
.lot{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
/* responsive background: a sharp but light file per viewport width and DPR */
.theatre{--bg-1x:url(art/bg-1280.webp)}
.scene{position:absolute;left:calc((100% - var(--sw))/2);bottom:0;width:var(--sw);height:var(--sch);container-type:size;
  background:var(--bg-1x) left top/100% 100% no-repeat;
  background-image:-webkit-image-set(url(art/bg-1280.webp) 1x,url(art/bg-2560.webp) 2x);
  background-image:image-set(url(art/bg-1280.webp) 1x,url(art/bg-2560.webp) 2x)}
@media (min-width:1281px){
  .theatre{--bg-1x:url(art/bg-1920.webp)}
  .scene{background-image:-webkit-image-set(url(art/bg-1920.webp) 1x,url(art/bg-3840.webp) 2x);
    background-image:image-set(url(art/bg-1920.webp) 1x,url(art/bg-3840.webp) 2x)}
}
@media (min-width:1921px){
  .theatre{--bg-1x:url(art/bg-2560.webp)}
  .scene{background-image:-webkit-image-set(url(art/bg-2560.webp) 1x,url(art/bg-3840.webp) 2x);
    background-image:image-set(url(art/bg-2560.webp) 1x,url(art/bg-3840.webp) 2x)}
}
/* a prop slot is --s x --prop-w % of the scene wide; its art is at most that tall too and stands on (--x,--y) */
.prop{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--s)*var(--prop-w)*1cqw);
  transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;
  transition:transform .2s,filter .2s;scroll-snap-align:center;z-index:var(--z,1)}
.prop:hover,.prop:focus-visible,.prop[aria-current="true"]{z-index:5}
.prop::before{content:'';position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
.prop img{width:auto;height:auto;max-width:100%;max-height:calc(var(--s)*var(--prop-w)*1cqw);display:block;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.prop.generic img{max-width:72%;max-height:calc(var(--s)*var(--prop-w)*.72cqw)}
.prop:focus-visible,.prop[aria-current="true"]{transform:translate(-50%,-104%) scale(1.06);filter:drop-shadow(0 0 14px var(--glow))}
.prop:focus-visible{outline:3px solid var(--glow);outline-offset:4px}
.prop .tag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.8);color:#fff;font-weight:800;font-size:clamp(.7rem,1vw,.95rem);padding:.2rem .55rem;border-radius:.5rem;opacity:0;pointer-events:none;transition:opacity .15s}
.prop:focus-visible .tag{opacity:1}
/* back-row props stand just below the screen: their title tag drops below them; edge props keep the tag on screen */
.prop[data-tag="below"] .tag{bottom:auto;top:100%;margin-top:.2rem}
.prop[data-edge="l"] .tag{left:0;transform:none}
.prop[data-edge="r"] .tag{left:auto;right:0;transform:none}
@media (hover:hover){
  .prop:hover{transform:translate(-50%,-104%) scale(1.06);filter:drop-shadow(0 0 14px var(--glow))}
  .prop:hover .tag{opacity:1}
}
.all-btn{background:var(--glow);color:#111;border:0;border-radius:999px;padding:.3rem .8rem;font:inherit;font-weight:800;font-size:clamp(.8rem,1vw,1rem);cursor:pointer;white-space:nowrap;min-height:36px}
@media (max-width:767px) and (orientation:portrait),(orientation:portrait) and (max-aspect-ratio:4/5){.topbar{padding-top:.25rem;padding-bottom:.25rem}.all-btn{min-height:32px;padding:.2rem .7rem}}
.skip-link{position:fixed;left:1rem;top:3.2rem;z-index:40;background:var(--glow);color:#111;padding:.4rem .8rem;border-radius:.5rem;font-weight:800;text-decoration:none}
.skip-link:not(:focus){clip-path:inset(50%);width:1px;height:1px;overflow:hidden;padding:0;white-space:nowrap}
.all-eps{margin:auto;width:min(32rem,92vw);max-height:min(85vh,42rem);background:#141a3a;color:#fff;border:2px solid var(--glow);border-radius:.8rem;padding:.8rem 1rem 1rem}
.all-eps[open]{display:flex;flex-direction:column}
.all-eps::backdrop{background:rgba(0,0,0,.65)}
.all-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.all-head h2{font-family:'More Sugar',cursive;color:var(--glow);font-size:1.4rem;font-weight:400}
.all-close{background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;min-width:44px;min-height:44px}
#all-search{width:100%;padding:.5rem .7rem;border-radius:.5rem;border:1px solid #556;background:var(--night);color:#fff;font:inherit;margin:.3rem 0 .6rem}
.all-eps ul{list-style:none;overflow-y:auto;display:grid;gap:.35rem;min-height:0}
.all-eps li[hidden]{display:none}
.ep-item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:rgba(255,255,255,.06);border:0;border-radius:.5rem;padding:.35rem .6rem;color:inherit;font:inherit;cursor:pointer}
.ep-item:hover,.ep-item:focus-visible{background:rgba(255,211,110,.2);outline:2px solid var(--glow)}
.ep-item img{width:3rem;height:3rem;object-fit:contain;flex:none}
.ep-item .t{font-weight:800;flex:1;min-width:0}
.ep-item .d{color:var(--wheat);font-size:.85rem;white-space:nowrap}
.ep-item .badge{background:var(--glow);color:#111;font-weight:800;font-size:.75rem;padding:.1rem .4rem;border-radius:.4rem;white-space:nowrap}
#all-empty{color:var(--wheat);text-align:center;padding:.5rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.prop[data-soon="true"] img{filter:brightness(.55) saturate(.6)}
.prop .soon{position:absolute;top:0;left:50%;transform:translate(-50%,-30%);max-width:max(100%,4.4rem);overflow:hidden;text-overflow:ellipsis;background:var(--glow);color:#111;font-weight:800;font-size:clamp(.65rem,.8vw,.8rem);padding:.1rem .45rem;border-radius:.4rem;white-space:nowrap}
/* --sh screen height, --st screen top, --swp/--swl portrait/landscape screen widths; shared by .screen and .watch-link.
   Projected on the barn wall: top 10%, height 46% of the scene (keep DEFAULT_LAYOUT.screen in drivein-core.js in sync). */
.screen-wrap{position:absolute;inset:0;pointer-events:none;z-index:10;
  --sh:calc(var(--sch)*.46);--st:calc(var(--top) + var(--sch)*.10);--swp:calc(var(--sh)*9/16);--swl:min(calc(var(--sh)*16/9),96vw)}
.lot{z-index:1}
.screen:focus{outline:none}
.screen{position:absolute;left:50%;top:var(--st);height:var(--sh);width:var(--swp);transform:translateX(-50%);
  /* projector light on the barn wall: a warm wash and a soft glow, no frame */
  background:radial-gradient(ellipse at 50% 45%,rgba(255,240,205,.34),rgba(255,222,160,.16) 65%,rgba(255,210,140,.1));
  border-radius:.25rem;box-shadow:0 0 18px 4px rgba(255,236,190,.35),0 0 70px 18px rgba(255,211,110,.22);
  pointer-events:auto;overflow:hidden;transition:width .45s ease}
.screen[data-mode="preview"],.screen[data-mode="playing"]{background:#0b0806}
.screen[data-format="landscape"]{width:var(--swl)}
.screen-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.5rem;padding:.6rem}
.screen-content iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen-content .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.screen-content strong{position:relative;font-family:'More Sugar',cursive;font-size:clamp(.85rem,min(2vw,4.2vh),1.6rem);color:var(--glow);text-shadow:0 2px 8px #000}
.screen-content em{position:relative;font-style:normal;color:var(--wheat);font-size:clamp(.75rem,3.4vh,1rem)}
.screen-content .play{position:relative;width:clamp(56px,4.5vw,96px);height:clamp(56px,4.5vw,96px);border-radius:50%;border:0;background:rgba(255,211,110,.92);color:#111;font-size:clamp(1.4rem,2vw,2.4rem);cursor:pointer}
.screen-content .soon-art{max-width:70%;max-height:45%;filter:brightness(.7)}
/* desktop: small pill beside the screen's top-right corner, outside the player and clear of the lot */
.watch-link{position:absolute;top:var(--st);left:calc(50% + var(--swp)/2 + .5rem);max-width:calc(50% - var(--swp)/2 - 1rem);
  background:rgba(0,0,0,.7);border-radius:999px;padding:.25rem .7rem;color:var(--wheat);font-weight:800;font-size:clamp(.85rem,.9vw,1.2rem);
  pointer-events:auto;text-shadow:0 1px 4px #000;text-decoration:none;white-space:nowrap;transition:left .45s ease}
.screen[data-format="landscape"]~.watch-link{left:calc(50% + var(--swl)/2 + .5rem);max-width:calc(50% - var(--swl)/2 - 1rem)}
.status{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:.6rem 1rem;border-radius:.6rem;z-index:20}
/* stacked layout: portrait phones and portrait tablets (keep in sync with the matchMedia in the boot script) */
@media (max-width:767px) and (orientation:portrait),(orientation:portrait) and (max-aspect-ratio:4/5){
  /* --lh lot height; the lot shows the bottom half of the scene (the bales and the cast), the blank wall is cropped */
  .theatre{height:auto;overflow:visible;--lh:55vh;--scn:calc(var(--lh)/.5)}
  .theatre::before{display:none}
  /* the screen is projected on a close-up of the barn wall */
  .screen-wrap{position:sticky;inset:auto;top:0;height:45vh;height:45svh;z-index:10;
    background:linear-gradient(rgba(11,16,38,.55),rgba(11,16,38,.25) 30%,rgba(11,16,38,.25)),var(--bg-1x) 50% 6%/300% auto no-repeat;
    background-color:var(--night);
    --sh:calc(45vh - 4.8rem);--st:2.6rem;--swl:min(92vw,calc(var(--sh)*16/9))}
  .screen[data-format="landscape"]{height:calc(var(--swl)*9/16)}
  .watch-link,.screen[data-format="landscape"]~.watch-link{left:50%;transform:translateX(-50%);max-width:92vw;white-space:nowrap;padding:.1rem .6rem;
    top:calc(var(--st) + var(--sh) + .3rem);transition:none}
  .screen[data-format="landscape"]~.watch-link{top:calc(var(--st) + var(--swl)*9/16 + .3rem)}
  .lot{position:relative;height:55vh;height:55svh;scroll-snap-type:x proximity}
  .scene{position:relative;left:auto;bottom:auto;height:var(--scn);width:calc(var(--scn)*var(--ar));margin-top:calc(var(--lh) - var(--scn))}
}
@supports (height:1svh){
  @media (max-width:767px) and (orientation:portrait),(orientation:portrait) and (max-aspect-ratio:4/5){
    .theatre{--lh:55svh}
    .screen-wrap{--sh:calc(45svh - 4.8rem)}
  }
}
@media (prefers-reduced-motion:reduce){
  .screen,.prop,.prop .tag,.watch-link{transition:none}
  .prop:hover,.prop:focus-visible,.prop[aria-current="true"]{transform:translate(-50%,-100%)}
}
</style>
</head>
<body>
<header class="topbar"><a href="../" aria-label="Back to nikepig.com">←<span class="bk"> nikepig.com</span></a><h1>Nikeverse Cartoons</h1><button type="button" class="all-btn" id="all-btn" hidden>All episodes</button></header>
<main class="theatre" id="theatre">
  <div class="screen-wrap">
    <div class="screen" id="screen" data-format="portrait" data-mode="idle" tabindex="-1">
      <div class="screen-content" id="screen-content"></div>
    </div>
    <a class="watch-link" id="watch-link" target="_blank" rel="noopener" hidden>Watch on YouTube ↗</a>
  </div>
  <div class="lot" id="lot"><a class="skip-link" id="skip-link" href="#all-eps" hidden>Skip to all episodes</a><div class="scene" id="scene"></div></div>
  <p class="status" id="status" role="status" hidden></p>
  <p id="announce" class="sr-only" aria-live="polite"></p>
</main>
<dialog class="all-eps" id="all-eps" aria-labelledby="all-eps-title">
  <div class="all-head"><h2 id="all-eps-title">All episodes</h2><button type="button" class="all-close" id="all-close" aria-label="Close">×</button></div>
  <input type="search" id="all-search" placeholder="Search by title" aria-label="Search episodes" autocomplete="off" autofocus>
  <ul id="all-list"></ul>
  <p id="all-empty" hidden>No episodes match.</p>
</dialog>

<script>
(async function () {
  'use strict';
  var D = window.DriveIn, $ = function (id) { return document.getElementById(id); };
  var state = D.INITIAL, byId = {}, lastTouch = 0, eps = [];
  function now() { return Date.now(); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  function renderScreen() {
    var scr = $('screen'), c = $('screen-content'), link = $('watch-link');
    var ep = state.id ? byId[state.id] : null;
    scr.dataset.format = ep ? ep.format : 'portrait';
    scr.dataset.mode = state.mode;
    c.textContent = ''; link.hidden = true;
    document.querySelectorAll('.prop[data-id]').forEach(function (b) { b.setAttribute('aria-current', String(!!ep && b.dataset.id === ep.id)); });
    if (!ep) {
      c.append(el('em', '', 'Now showing'), el('strong', '', 'Nikeverse Cartoons'), el('em', '', 'Pick a prop to preview'));
      return;
    }
    if (D.isComingSoon(ep, now())) {
      var art = el('img', 'soon-art'); art.src = D.propImage(ep); art.alt = ep.alt;
      c.append(art, el('strong', '', ep.title), el('em', 'soon-label', 'Premieres ' + D.formatPremiere(ep.premiereMs)));
      scr.dataset.mode = 'soon';
      return;
    }
    link.href = D.watchUrl(ep); link.hidden = false;
    if (state.mode === 'playing') {
      var f = document.createElement('iframe');
      f.src = D.embedUrl(ep.youtube); f.title = ep.title;
      f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      c.append(f);
      return;
    }
    var t = el('img', 'thumb'); t.alt = ''; t.src = D.thumbUrl(ep.youtube);
    t.onerror = function () { t.onerror = null; t.src = D.propImage(ep); };
    var play = el('button', 'play', '▶'); play.type = 'button'; play.setAttribute('aria-label', 'Play ' + ep.title);
    play.onclick = function () {
      var id = ep.id;
      dispatch({ type: 'activate', id: id, pointer: 'mouse' });
      var frame = $('screen-content').querySelector('iframe');
      if (frame) frame.focus();
      else { var pb = document.querySelector('.prop[data-id="' + id + '"]'); if (pb) pb.focus(); }
    };
    c.append(t, el('strong', '', ep.title), play);
  }

  function announce(text) { $('announce').textContent = text; }

  function dispatch(ev) {
    var prevMode = state.mode, prevId = state.id;
    var next = D.reduce(state, ev, { comingSoon: function (id) { return D.isComingSoon(byId[id], now()); } });
    if (ev.type === 'activate' && D.isComingSoon(byId[ev.id], now())) {
      var soonEp = byId[ev.id];
      announce(soonEp.title + ' premieres ' + D.formatPremiere(soonEp.premiereMs));
    } else if (next.mode === 'playing' && (prevMode !== 'playing' || prevId !== next.id)) {
      announce('Now playing ' + byId[next.id].title);
    }
    if (next.mode === prevMode && next.id === prevId) return;
    state = next; renderScreen();
    if (next.id && next.id !== prevId && location.hash !== D.formatHash(next.id))
      history.replaceState(history.state, '', D.formatHash(next.id));
  }

  function propImg(ep) {
    var img = el('img'); img.src = D.propImage(ep); img.alt = ''; img.decoding = 'async';
    img.onerror = function () { img.onerror = null; img.src = D.REEL_IMAGE; };
    return img;
  }

  // "All episodes" list: newest first, rebuilt on open so premiere badges are current.
  function openList() {
    var ul = $('all-list'), t = now();
    ul.textContent = '';
    eps.map(function (e, i) { return { e: e, i: i }; })
      .sort(function (a, b) { return (b.e.premiereMs - a.e.premiereMs) || (a.i - b.i); })
      .forEach(function (x) {
        var ep = x.e, li = el('li'), b = el('button', 'ep-item'), soon = D.isComingSoon(ep, t);
        b.type = 'button'; b.dataset.id = ep.id;
        b.append(propImg(ep), el('span', 't', ep.title));
        b.append(soon ? el('span', 'badge', 'Premieres ' + D.formatPremiere(ep.premiereMs)) : el('span', 'd', D.formatPremiere(ep.premiereMs)));
        b.addEventListener('click', function () { choose(ep.id); });
        li.append(b); ul.append(li);
      });
    filterList();
    $('all-eps').showModal();
  }
  function filterList() {
    var q = $('all-search').value.trim().toLowerCase(), shown = 0;
    $('all-list').querySelectorAll('li').forEach(function (li) {
      var ep = byId[li.firstChild.dataset.id];
      li.hidden = !!q && ep.title.toLowerCase().indexOf(q) < 0 && ep.id.indexOf(q) < 0;
      if (!li.hidden) shown++;
    });
    $('all-empty').hidden = shown > 0;
  }
  function choose(id) {
    $('all-eps').close();
    dispatch({ type: 'select', id: id });
    var b = document.querySelector('.prop[data-id="' + id + '"]');
    if (b) { b.scrollIntoView({ inline: 'center', block: 'nearest' }); b.focus({ preventScroll: true }); }
    else $('screen').focus();
  }

  function place(b, p) {
    b.style.setProperty('--x', p.x); b.style.setProperty('--y', p.y); b.style.setProperty('--s', p.scale); b.style.setProperty('--z', p.z);
    if (p.y < 72) b.dataset.tag = 'below';
    if (p.x < 15) b.dataset.edge = 'l'; else if (p.x > 85) b.dataset.edge = 'r';
  }

  function renderProps() {
    var lay = D.layoutProps(eps, D.DEFAULT_LAYOUT), scene = $('scene');
    lay.props.forEach(function (p) {
      var ep = byId[p.id], soon = D.isComingSoon(ep, now());
      var b = el('button', ep.image ? 'prop' : 'prop generic'); b.type = 'button'; b.dataset.id = ep.id; b.dataset.soon = String(soon);
      place(b, p);
      b.setAttribute('aria-label', soon ? ep.title + ', premieres ' + D.formatPremiere(ep.premiereMs) : 'Play ' + ep.title);
      var img = propImg(ep); img.loading = 'lazy';
      b.append(img, el('span', 'tag', ep.title));
      if (soon) b.append(el('span', 'soon', D.formatPremiere(ep.premiereMs)));
      b.addEventListener('pointerenter', function (e) { if (e.pointerType !== 'touch') dispatch({ type: 'hover', id: ep.id }); });
      b.addEventListener('pointerdown', function (e) { if (e.pointerType === 'touch') lastTouch = now(); });
      b.addEventListener('focus', function () { if (now() - lastTouch > 800) dispatch({ type: 'hover', id: ep.id }); });
      b.addEventListener('click', function (e) {
        var p = now() - lastTouch < 800 ? 'touch' : (e.detail === 0 ? 'keyboard' : 'mouse');
        dispatch({ type: 'activate', id: ep.id, pointer: p });
      });
      scene.append(b);
    });
    if (lay.crate) {
      var c = el('button', 'prop crate'); c.type = 'button'; place(c, lay.crate);
      c.setAttribute('aria-label', 'All episodes (' + lay.archive.length + ' older in the reel crate)');
      var ci = el('img'); ci.src = 'props/crate.webp';
      ci.onerror = function () { ci.onerror = null; ci.src = 'props/placeholder-crate.svg'; }; ci.alt = ''; ci.decoding = 'async';
      c.append(ci, el('span', 'tag', 'All episodes'));
      c.addEventListener('click', openList);
      scene.append(c);
    }
  }

  function selectFromHash() {
    var id = D.parseHash(location.hash, Object.keys(byId));
    if (id) dispatch({ type: 'select', id: id });
  }

  var MAX_TIMEOUT = 2147483647, refreshTimer = null;
  function scheduleRefresh() {
    if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
    var t = now(), next = null;
    eps.forEach(function (e) { if (e.premiereMs > t && (next === null || e.premiereMs < next)) next = e.premiereMs; });
    if (next === null) return;
    var delay = next - t;
    if (delay > MAX_TIMEOUT) return;
    refreshTimer = setTimeout(function () {
      var active = document.activeElement;
      var focusedId = (active && active.classList.contains('prop')) ? active.dataset.id : null;
      document.querySelectorAll('.prop').forEach(function (b) { b.remove(); });
      renderProps();
      renderScreen();
      if (focusedId) { var fb = document.querySelector('.prop[data-id="' + focusedId + '"]'); if (fb) fb.focus(); }
      scheduleRefresh();
    }, delay);
  }

  var list = null;
  try { var r = await fetch('episodes.json', { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); list = await r.json(); }
  catch (e) { try { list = JSON.parse($('episodes-fallback').textContent); } catch (_) { list = null; } }
  try { eps = D.validateEpisodes(list); if (!eps.length) throw new Error('empty'); }
  catch (e) { var s = $('status'); s.hidden = false; requestAnimationFrame(function () { s.textContent = 'Episodes are warming up, try again'; }); renderScreen(); return; }
  eps.forEach(function (e) { byId[e.id] = e; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('all-eps').open) dispatch({ type: 'escape' }); });
  $('all-btn').addEventListener('click', openList);
  $('skip-link').addEventListener('click', function (e) { e.preventDefault(); openList(); });
  $('all-close').addEventListener('click', function () { $('all-eps').close(); });
  $('all-search').addEventListener('input', filterList);
  $('all-btn').hidden = false; $('skip-link').hidden = false;
  renderProps(); renderScreen(); scheduleRefresh();
  if (matchMedia('(max-width:767px) and (orientation:portrait), (orientation:portrait) and (max-aspect-ratio:4/5)').matches) {
    var lot = $('lot'); lot.scrollLeft = (lot.scrollWidth - lot.clientWidth) / 2;
  }
  selectFromHash();
  addEventListener('hashchange', selectFromHash);

  // ?debug=layout: magenta dots on every DEFAULT_LAYOUT spot (the point a prop stands on) plus the screen footprints.
  if (/[?&]debug=layout(&|$)/.test(location.search)) {
    var L = D.DEFAULT_LAYOUT, dots = [], sc = L.screen;
    Object.keys(L.special).forEach(function (k) { L.special[k].forEach(function (s) { dots.push([s.x, s.y, k]); }); });
    if (L.crate) dots.push([L.crate.x, L.crate.y, 'crate']);
    L.rows.forEach(function (r, i) { r.xs.forEach(function (x) { dots.push([x, r.y, 'r' + i]); }); });
    dots.forEach(function (d) {
      var m = el('div', 'debug-dot', d[2]);
      m.style.cssText = 'position:absolute;z-index:6;pointer-events:none;left:' + d[0] + '%;top:' + d[1] + '%;transform:translate(-50%,-50%);background:#f0f;color:#fff;font:10px monospace;padding:1px 3px';
      $('scene').append(m);
    });
    [9 / 16, 16 / 9].forEach(function (f) {
      var w = sc.height * f / L.aspect, r = el('div', 'debug-dot');
      r.style.cssText = 'position:absolute;z-index:6;pointer-events:none;border:2px dashed #0ff;left:' + (sc.x - w / 2) + '%;top:' + sc.top + '%;width:' + w + '%;height:' + sc.height + '%';
      $('scene').append(r);
    });
  }
})();
</script>
</body>
</html>
